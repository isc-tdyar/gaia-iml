services:
  iris:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gaia-iml-iris
    restart: always
    environment:
      - ISC_CPF_MERGE_FILE=/home/irisowner/dev/merge.cpf
      # Optional: enables the AI Hub analysis agent. Without it the IntegratedML
      # pipeline still runs and result.csv is still produced.
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
    ports:
      - 1972
      - 52773
      - 53773
    volumes:
      - ./:/home/irisowner/dev
